name: shared_ui
description: Theme and reusable widgets shared by the ChargeKaro apps.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  shared_data:
  shared_models:

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/chargekaro_logo.jpg
  fonts:
    # Plus Jakarta Sans (SIL Open Font License 1.1, see fonts/OFL.txt).
    # Latin + Latin Extended subsets, which include the rupee sign.
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-800.ttf
          weight: 800
