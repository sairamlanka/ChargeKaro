name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  POSTGREST_VERSION: v12.2.3

jobs:
  database:
    name: Database (migrations, RLS, workflows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/chargekaro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - run: scripts/db-reset-test.sh
      - working-directory: supabase/tests
        run: npm ci && npm test

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/chargekaro_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - run: scripts/db-reset-test.sh
      - working-directory: supabase/functions
        run: |
          deno lint
          deno check */index.ts
          deno test --allow-env --allow-net=127.0.0.1,localhost _tests/

  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit and widget tests
        run: |
          for pkg in packages/shared_models packages/shared_validation packages/shared_data packages/shared_ui apps/admin_panel apps/business_app; do
            echo "::group::$pkg"
            (cd "$pkg" && flutter test) || exit 1
            echo "::endgroup::"
          done
      - name: Build Admin Panel (web)
        working-directory: apps/admin_panel
        # Placeholder config only proves the build; real values come from deployment secrets.
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_ci_placeholder

  rest-integration:
    name: Repositories against PostgREST
    runs-on: ubuntu-latest
    needs: database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - name: Install PostgREST
        run: |
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz" | tar -xJ -C /usr/local/bin
      - run: flutter pub get
      - run: scripts/rest-integration.sh
